<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Counter</title>
    <meta name="description" content="Count characters and lines in your text.">
    <meta property="og:title" content="String Counter">
    <meta property="og:description" content="Count characters and lines in your text.">
    <meta property="og:type" content="article">

</head>

<body id="body">
    <header>
        <h1>String Counter</h1>
        <p>Count characters and lines in your text.</p>
        <hr />
    </header>

    <form id="form">
        <div>
            <label for="str">Input</label>
            <textarea id="str" cols="30" rows="10"></textarea>
        </div>
    </form>

    <div>
        Characters: <span id="counter">0</span><br />
        Lines: <span id="counter-line">0</span><br />
    </div>

    <script type="module" src="/dist/string/string_counter.js"></script>
</body>

</html>
